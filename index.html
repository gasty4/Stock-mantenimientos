<style>
:root{
  --bg:#14181C;
  --panel:#1B2026;
  --panel-2:#232A31;
  --border:#2E363D;
  --border-soft:#262D33;
  --text:#EDEFF1;
  --text-dim:#8F9BA3;
  --text-faint:#5E6970;
  --amber:#F2A93B;
  --amber-dim:#4A3A1E;
  --green:#4E9F6E;
  --green-dim:#1D3327;
  --blue:#5B8DBE;
  --blue-dim:#1D2C3A;
  --red:#C75450;
  --red-dim:#3A2223;
  --radius:14px;
  --radius-sm:9px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
button{font-family:inherit;}
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  max-width:640px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  border-left:1px solid var(--border-soft);
  border-right:1px solid var(--border-soft);
}
/* ---------- Topbar ---------- */
.topbar{
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  background:var(--bg);
  border-bottom:1px solid var(--border-soft);
  flex-shrink:0;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.01em;}
.topbar .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.icon-btn:active{background:var(--panel-2);}
.icon-btn svg{width:18px;height:18px;}
.search-row{margin-top:12px;display:flex;gap:8px;}
.search-box{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--border);border-radius:11px;padding:0 12px;height:38px;
}
.search-box svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
.search-box input{
  background:none;border:none;outline:none;color:var(--text);font-size:14px;width:100%;height:100%;
}
.search-box input::placeholder{color:var(--text-faint);}

/* ---------- Chips ---------- */
.chip-row{
  display:flex;gap:7px;overflow-x:auto;padding:2px 18px 10px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel);color:var(--text-dim);font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.chip .count{font-weight:500;opacity:0.65;font-size:11.5px;}
.chip.active{background:var(--amber);border-color:var(--amber);color:#1B1204;}
.chip.active .count{opacity:0.55;}
.chip.state-Pendiente.active{background:var(--amber);border-color:var(--amber);color:#1B1204;}
.chip.state-Lista.active{background:var(--green);border-color:var(--green);color:#0C1F14;}
.chip.state-MND.active{background:var(--red);border-color:var(--red);color:#210D0C;}
.chip.state-Asociar.active{background:var(--blue);border-color:var(--blue);color:#0D1A26;}
.chip.state-Vencido{color:var(--red);}
.chip.state-Vencido.active{background:var(--red);border-color:var(--red);color:#210D0C;}

/* ---------- Month strip ---------- */
.month-strip{
  display:flex;gap:8px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;
  border-bottom:1px solid var(--border-soft);
}
.month-strip::-webkit-scrollbar{display:none;}
.month-pill{
  flex-shrink:0;min-width:64px;padding:9px 8px 8px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);text-align:center;cursor:pointer;
}
.month-pill .m-name{display:block;font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.month-pill .m-count{display:block;font-family:'Space Grotesk';font-size:19px;font-weight:700;margin-top:3px;color:var(--text);}
.month-pill.active{background:var(--panel-2);border-color:var(--amber);}
.month-pill.active .m-name{color:var(--amber);}
.month-pill.current::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--amber);margin:4px auto 0;}

/* ---------- Main / views ---------- */
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px;}
.view{display:none;}
.view.active{display:block;}
.section-label{
  padding:14px 18px 6px;font-size:11.5px;font-weight:600;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:0.04em;
}
.empty-state{
  padding:50px 30px;text-align:center;color:var(--text-faint);
}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:0.5;}
.empty-state p{margin:0;font-size:13.5px;line-height:1.5;}

/* ---------- Task card ---------- */
.task-list{padding:6px 18px 4px;display:flex;flex-direction:column;gap:9px;}
.task-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;cursor:pointer;position:relative;
}
.task-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.task-card .cliente{font-size:14.5px;font-weight:600;line-height:1.3;}
.task-card .localidad-line{
  display:flex;align-items:center;gap:5px;color:var(--text-dim);font-size:12.5px;margin-top:3px;
}
.task-card .localidad-line svg{width:11px;height:11px;flex-shrink:0;}
.badge{
  flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;
  text-transform:uppercase;letter-spacing:0.02em;white-space:nowrap;
}
.badge.state-Pendiente{background:var(--amber-dim);color:var(--amber);}
.badge.state-Lista{background:var(--green-dim);color:var(--green);}
.badge.state-MND{background:var(--red-dim);color:var(--red);}
.badge.state-Asociar{background:var(--blue-dim);color:var(--blue);}
.task-card .meta-row{
  display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px;
}
.meta-tag{
  font-size:11.5px;color:var(--text-dim);background:var(--panel-2);border-radius:7px;
  padding:4px 8px;display:flex;align-items:center;gap:4px;
}
.meta-tag b{color:var(--text);font-weight:600;}
.meta-tag.dist{color:var(--amber);background:var(--amber-dim);}
.quick-actions{display:flex;gap:6px;margin-top:11px;}
.qa-btn{
  flex:1;padding:7px 4px;border-radius:9px;border:1px solid var(--border);background:transparent;
  color:var(--text-dim);font-size:11.5px;font-weight:600;cursor:pointer;
}
.qa-btn.active-Pendiente{background:var(--amber-dim);color:var(--amber);border-color:transparent;}
.qa-btn.active-Lista{background:var(--green-dim);color:var(--green);border-color:transparent;}
.qa-btn.active-MND{background:var(--red-dim);color:var(--red);border-color:transparent;}
.qa-btn.active-Asociar{background:var(--blue-dim);color:var(--blue);border-color:transparent;}

/* ---------- Tabbar ---------- */
.tabbar{
  display:flex;border-top:1px solid var(--border-soft);background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
.tab-btn{
  flex:1;background:none;border:none;padding:10px 4px calc(8px + env(safe-area-inset-bottom) - env(safe-area-inset-bottom));
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-faint);cursor:pointer;
}
.tab-btn svg{width:21px;height:21px;}
.tab-btn span{font-size:10.5px;font-weight:600;}
.tab-btn.active{color:var(--amber);}

/* ---------- Sheet / modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:40;opacity:0;pointer-events:none;
  transition:opacity 0.18s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--panel);
  border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;
  z-index:41;transform:translateY(100%);transition:transform 0.22s cubic-bezier(.2,.8,.3,1);
  max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:10px auto 4px;flex-shrink:0;}
.sheet-head{
  display:flex;justify-content:space-between;align-items:center;padding:8px 18px 10px;
  border-bottom:1px solid var(--border-soft);flex-shrink:0;
}
.sheet-head h3{margin:0;font-size:16px;font-weight:700;}
.sheet-body{overflow-y:auto;padding:14px 18px 24px;}
.link-btn{background:none;border:none;color:var(--amber);font-size:13px;font-weight:600;cursor:pointer;padding:4px;}

.field-label{font-size:11.5px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;margin:16px 0 8px;}
.field-label:first-child{margin-top:0;}
.option-grid{display:flex;flex-wrap:wrap;gap:7px;}
.option-btn{
  padding:8px 13px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;
}
.option-btn.active{background:var(--amber);border-color:var(--amber);color:#1B1204;}
select, input[type=text], input[type=number], input[type=date], textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238F9BA3' stroke-width='2'><path d='M2 5l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;
}
label.chk{display:flex;align-items:center;gap:9px;padding:10px 0;font-size:13.5px;color:var(--text);}
label.chk input{width:17px;height:17px;accent-color:var(--amber);}

.modal-sheet .sheet-body{padding-top:6px;}
.detail-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
.detail-row:last-child{border-bottom:none;}
.detail-row .k{color:var(--text-faint);}
.detail-row .v{color:var(--text);font-weight:600;text-align:right;}
.hist-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.hist-dot{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:8px;}
.hist-dot.amarillo{background:var(--amber-dim);color:var(--amber);}
.hist-dot.verde{background:var(--green-dim);color:var(--green);}

.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;}
.state-big-btn{
  padding:13px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);font-size:13px;font-weight:700;cursor:pointer;
}
.state-big-btn.sel-Pendiente{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
.state-big-btn.sel-Lista{background:var(--green-dim);border-color:var(--green);color:var(--green);}
.state-big-btn.sel-MND{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.state-big-btn.sel-Asociar{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}

.primary-btn{
  width:100%;background:var(--amber);color:#1B1204;border:none;border-radius:12px;
  padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:16px;
}
.danger-link{display:block;text-align:center;color:var(--red);font-size:13px;font-weight:600;
  background:none;border:none;margin-top:14px;padding:6px;width:100%;cursor:pointer;}

.fab{
  position:absolute;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:52px;height:52px;
  border-radius:16px;background:var(--amber);color:#1B1204;border:none;display:flex;
  align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.4);cursor:pointer;z-index:20;
}
.fab svg{width:24px;height:24px;}

/* ---------- Plan view ---------- */
.plan-date-bar{
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-soft);
}
.plan-date-bar input[type=date]{flex:1;}
.plan-summary{display:flex;gap:8px;padding:12px 18px 0;}
.plan-stat{
  flex:1;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:9px 10px;text-align:center;
}
.plan-stat .n{font-family:'Space Grotesk';font-size:18px;font-weight:700;}
.plan-stat .l{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}
.plan-card{
  background:transparent;border:none;padding:0;
  display:flex;gap:8px;align-items:flex-start;
}
.plan-card-side{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;padding-top:14px;}
.plan-card .num{
  font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--text-faint);flex-shrink:0;text-align:center;
}
.plan-card-inner{flex:1;min-width:0;}
.plan-card-inner .task-card{cursor:pointer;}
.plan-order-controls{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.order-btn{
  width:26px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.order-btn svg{width:13px;height:13px;}
.plan-remove{
  width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:14px;
}
.plan-remove svg{width:16px;height:16px;}

.picker-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--border-soft);
}
.picker-item .cliente{font-size:13.5px;font-weight:600;}
.picker-item .sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.add-btn{
  flex-shrink:0;padding:7px 14px;border-radius:9px;border:1px solid var(--amber);background:transparent;
  color:var(--amber);font-size:12px;font-weight:700;cursor:pointer;
}
.add-btn.added{background:var(--amber);color:#1B1204;}

::-webkit-scrollbar{width:0;height:0;}

/* ---------- Overdue banner ---------- */
#overdueBanner{
  background:var(--red-dim);border-bottom:1px solid var(--red);padding:10px 18px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#overdueBanner svg{width:17px;height:17px;color:var(--red);flex-shrink:0;}
#overdueBanner p{margin:0;font-size:12.5px;color:var(--text);flex:1;line-height:1.4;}
#overdueBanner button{
  background:none;border:1px solid var(--red);color:var(--red);border-radius:8px;
  padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0;
}
.badge.state-Vencido{background:var(--red-dim);color:var(--red);}
.mix-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.mix-chip{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;}
.mix-chip.state-Pendiente{background:var(--amber-dim);color:var(--amber);}
.mix-chip.state-Lista{background:var(--green-dim);color:var(--green);}
.mix-chip.state-MND{background:var(--red-dim);color:var(--red);}
.mix-chip.state-Asociar{background:var(--blue-dim);color:var(--blue);}
.abono-badge{
  font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;color:#14181C;
}
.fresh-dot{display:inline-flex;align-items:center;gap:5px;}
.fresh-dot .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
.fresh-fresco{background:#4E9F6E;}
.fresh-medio{background:#F2A93B;}
.fresh-alerta{background:#E07B39;}
.fresh-vencido{background:#C75450;}
.note-preview{
  margin-top:9px;padding:8px 10px;background:var(--amber-dim);border-radius:9px;
  font-size:11.5px;color:var(--amber);display:flex;gap:6px;align-items:flex-start;line-height:1.4;
}
.note-preview svg{width:13px;height:13px;flex-shrink:0;margin-top:1px;}
.drag-handle{
  width:22px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  color:var(--text-faint);cursor:grab;touch-action:none;
}
.drag-handle svg{width:15px;height:15px;}
.plan-card.dragging{opacity:0.5;}
.plan-mini-actions{display:flex;gap:5px;margin-top:9px;}
.plan-mini-btn{
  flex:1;padding:6px 2px;border-radius:8px;border:1px solid var(--border);background:transparent;
  color:var(--text-dim);font-size:10.5px;font-weight:600;cursor:pointer;
}
.plan-mini-btn.active-Pendiente{background:var(--amber-dim);color:var(--amber);border-color:transparent;}
.plan-mini-btn.active-Lista{background:var(--green-dim);color:var(--green);border-color:transparent;}
.plan-mini-btn.active-MND{background:var(--red-dim);color:var(--red);border-color:transparent;}
.plan-mini-btn.active-Asociar{background:var(--blue-dim);color:var(--blue);border-color:transparent;}
.dist-editor-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}
.dist-editor-row .lbl{font-size:13px;font-weight:600;}
.dist-editor-row input{width:64px;text-align:center;padding:8px 4px;}
.dist-sum-hint{font-size:11.5px;margin-top:6px;color:var(--text-faint);}
.dist-sum-hint.err{color:var(--red);}
.stock-card{cursor:default;}
.stock-card .cliente{font-family:'Space Grotesk';letter-spacing:0.01em;}
.inv-row{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 13px;margin-bottom:9px;
}
.inv-row .inv-ubic{font-size:10.5px;color:var(--amber);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:5px;}
.inv-row .cliente{font-size:14px;font-weight:600;}
.inv-row .desc{font-size:12px;color:var(--text-dim);margin-top:2px;}
.inv-row-bottom{display:flex;align-items:center;gap:8px;margin-top:10px;}
.inv-sys{font-size:11.5px;color:var(--text-dim);background:var(--panel-2);border-radius:7px;padding:6px 9px;white-space:nowrap;}
.inv-count-input{width:70px !important;text-align:center;padding:8px 4px;flex-shrink:0;}
.inv-diff{font-size:11px;font-weight:700;padding:6px 9px;border-radius:7px;white-space:nowrap;flex-shrink:0;margin-left:auto;}
.inv-diff.ok{background:var(--green-dim);color:var(--green);}
.inv-diff.bad{background:var(--red-dim);color:var(--red);}
.inv-diff.pending{background:var(--panel-2);color:var(--text-faint);}
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div>
        <h1 id="pageTitle">Mantenimientos</h1>
        <div class="sub" id="pageSub">Cargando…</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="btnBackup" title="Copia de seguridad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5v1.05A5.5 5.5 0 0 0 8.5 19H17a4 4 0 0 0 .5-7.96A5 5 0 0 0 12 2z"/><path d="M12 12v6"/><polyline points="9.5 15.5 12 18 14.5 15.5"/></svg>
        </button>
        <input type="file" id="importFileInput" accept=".xlsx" style="display:none;">
        <button class="icon-btn" id="btnSettings" title="Distancias">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="btnFilter" title="Ordenar y filtrar" style="position:relative;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          <span id="filterDot" style="display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:1.5px solid var(--bg);"></span>
        </button>
      </div>
    </div>
    <div class="search-row" id="searchRow">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar cliente, localidad o dirección…">
      </div>
    </div>
    <div class="chip-row" id="stateChipRow"></div>
  </header>

  <div id="overdueBanner" style="display:none;"></div>

  <main>
    <section class="view active" id="view-meses">
      <div class="month-strip" id="monthStrip"></div>
      <div class="section-label" id="mesesLabel">Este mes</div>
      <div class="task-list" id="mesesList"></div>
    </section>

    <section class="view" id="view-plan">
      <div class="plan-date-bar">
        <button class="icon-btn" id="planPrevDay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <input type="date" id="planDate">
        <button class="icon-btn" id="planNextDay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="plan-summary" id="planSummary"></div>
      <div class="section-label">Recorrido del día</div>
      <div class="task-list" id="planList"></div>
    </section>

    <section class="view" id="view-todos">
      <div class="section-label" id="todosLabel">Todas las tareas</div>
      <div class="task-list" id="todosList"></div>
    </section>

    <section class="view" id="view-stock">
      <div class="chip-row" id="stockSourceChips"></div>
      <div class="search-row" style="padding:0 18px 10px;">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="stockSearchInput" placeholder="Buscar por código o descripción…">
        </div>
        <button class="icon-btn" id="btnStockRefresh" title="Actualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="icon-btn" id="btnStockConfig" title="Configurar archivos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="btnInventario" title="Inventario">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
      </div>
      <div class="chip-row" id="stockFilterChips" style="padding-top:0;padding-bottom:8px;"></div>
      <button class="option-btn" id="stockModelFilterBtn" style="margin:0 18px 8px;display:none;width:calc(100% - 36px);text-align:left;">Todos los modelos</button>
      <div class="dist-sum-hint" id="stockStatus" style="padding:0 18px 8px;"></div>
      <div class="task-list" id="stockList"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd" title="Agregar tarea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="meses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Meses</span>
    </button>
    <button class="tab-btn" data-view="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
      <span>Planificar</span>
    </button>
    <button class="tab-btn" data-view="todos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Todos</span>
    </button>
    <button class="tab-btn" data-view="stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span>Stock</span>
    </button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>

<!-- Filter sheet -->
<div class="sheet" id="filterSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Ordenar y filtrar</h3><button class="link-btn" id="filterReset">Restablecer</button></div>
  <div class="sheet-body">
    <div class="field-label">Ordenar por</div>
    <div class="option-grid" id="sortOptions"></div>
    <div class="field-label">Tipo de abono</div>
    <div class="option-grid" id="tipoOptions"></div>
    <div class="field-label">Localidad <span id="locFilterCount" style="color:var(--amber);"></span></div>
    <div id="localidadCheckList" style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:2px 12px;"></div>
    <button class="primary-btn" id="filterApply">Aplicar</button>
  </div>
</div>

<!-- Task detail modal -->
<div class="sheet modal-sheet" id="taskModal">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3 id="modalTitle">Tarea</h3><button class="link-btn" id="modalClose">Cerrar</button></div>
  <div class="sheet-body" id="modalBody"></div>
</div>

<!-- Add task sheet -->
<div class="sheet" id="addSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Nueva tarea</h3><button class="link-btn" id="addClose">Cerrar</button></div>
  <div class="sheet-body" id="addBody"></div>
</div>

<!-- Distances settings sheet -->
<div class="sheet" id="distSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Distancias por localidad</h3><button class="link-btn" id="distClose">Cerrar</button></div>
  <div class="sheet-body" id="distBody"></div>
</div>

<!-- Stock: configuración de archivos de Drive -->
<div class="sheet" id="stockConfigSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Archivos de stock</h3><button class="link-btn" id="stockConfigClose">Cerrar</button></div>
  <div class="sheet-body" id="stockConfigBody"></div>
</div>

<!-- Stock: selección múltiple de modelos -->
<div class="sheet" id="stockModelSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Filtrar por modelo</h3><button class="link-btn" id="stockModelClose">Listo</button></div>
  <div class="sheet-body">
    <div id="stockModelCheckList" style="max-height:50vh;overflow-y:auto;"></div>
  </div>
</div>

<!-- Inventario por depósito -->
<div class="sheet" id="inventarioSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3 id="inventarioTitle">Inventario</h3><button class="link-btn" id="inventarioClose">Cerrar</button></div>
  <div class="sheet-body">
    <div class="plan-summary" id="inventarioSummary" style="padding:0;margin-bottom:12px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="link-btn" id="inventarioExportar" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:8px;">Exportar diferencias</button>
      <button class="danger-link" id="inventarioReiniciar" style="flex:1;margin:0;border:1px solid var(--red);border-radius:10px;padding:8px;">Reiniciar conteo</button>
    </div>
    <div id="inventarioList"></div>
  </div>
</div>

<!-- Add-to-plan picker sheet -->
<div class="sheet" id="planPickerSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Agregar al recorrido</h3><button class="link-btn" id="planPickerClose">Listo</button></div>
  <div class="sheet-body" id="planPickerBody"></div>
</div>

<!-- Fecha de realización -->
<div class="sheet" id="dateSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3 id="dateSheetTitle">¿Qué día se hizo?</h3><button class="link-btn" id="dateSheetCancel">Cancelar</button></div>
  <div class="sheet-body" id="dateSheetBody"></div>
</div>

<!-- Copia de seguridad: Excel + Google Drive -->
<div class="sheet" id="backupSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Copia de seguridad</h3><button class="link-btn" id="backupClose">Cerrar</button></div>
  <div class="sheet-body" id="backupBody"></div>
</div>

<script src="./app.js?v=19"></script>
</body>
</html>
